version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. DATABASE UTAMA (PostgreSQL 16)
  # Menyimpan: Data User, Log Perangkat, Session, & Tabel Otorisasi RADIUS
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16
    container_name: captive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. BACKEND API SERVICE (Auth Engine, Log Device, OTP, Redirect)
  # ---------------------------------------------------------------------------
  app:
    build: ./backend
    container_name: captive_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      PORT: ${BACKEND_PORT:-3000}
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8080}:3000"

  # ---------------------------------------------------------------------------
  # 3. WEB FRONTEND (Landing Page Custom & Terms Conditions - Orang 2)
  # ---------------------------------------------------------------------------
  app_web:
    build: ./app/src
    container_name: captive_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
    ports:
      - "${WEB_EXTERNAL_PORT:-8081}:80"

  # ---------------------------------------------------------------------------
  # 4. DASHBOARD MONITORING SERVICE (Standalone Admin Dashboard - Orang 3)
  # ---------------------------------------------------------------------------
  dashboard:
    build: ./dashboard
    container_name: captive_dashboard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      REACT_APP_API_URL: http://localhost:${BACKEND_EXTERNAL_PORT:-8080}
    ports:
      - "${DASHBOARD_EXTERNAL_PORT:-8082}:80"

  # ---------------------------------------------------------------------------
  # 5. FREERADIUS SERVER (External Captive Portal Controller)
  # ---------------------------------------------------------------------------
  radius:
    image: freeradius/freeradius-server:latest
    container_name: captive_radius
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./radius/entrypoint.sh:/entrypoint.sh
    entrypoint: ["/entrypoint.sh"]
    ports:
      - "1812:1812/udp" # Authentication
      - "1813:1813/udp" # Accounting

  # ---------------------------------------------------------------------------
  # 6. PGADMIN (Database Management Interface)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: captive_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${PGADMIN_EXTERNAL_PORT:-5050}:80"
    depends_on:
      - db

volumes:
  db_data: